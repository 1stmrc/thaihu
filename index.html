<!-- File cha của: khung-nhap-bien-so.js, thanh-dieu-huong-tab.js, hop-thoai-nhap-doai.js, hop-thoai-loi-nhuan.js, cua-so-cai-dat.js, dong-co-bam-gio-va-ky-luc.js, bieu-do-duong-song-ky-luc.js, tinh-toan-loi-lo-doi-hinh.js, giao-dien-thanh-bam-gio-chan-bang.js, giao-dien-dashboard-thong-ke.js -->

<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thái Hư - Bản Cấu Hình Vuốt Kéo Cao Cấp</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link class="custom-style" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .custom-scrollbar::-webkit-scrollbar { 
            width: 6px; 
            height: 6px; 
        }

        .custom-scrollbar::-webkit-scrollbar-track { 
            background: #111827; 
            border-radius: 4px; 
        }

        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: #374151; 
            border-radius: 4px; 
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover { 
            background: #4b5563; 
        }

        html, body { 
            height: 100%;
            max-height: 100vh;
            overflow: hidden !important; 
            display: flex; 
            flex-direction: column; 
            user-select: none; 
        }

        .dragging-row { 
            opacity: 0.4; 
            background-color: #1f2937 !important; 
            border: 2px dashed #3b82f6 !important; 
        }

        .bg-gray-955 { 
            background-color: #0b0f19 !important; 
        }

        @keyframes alertFlashRed {
            0%, 100% { background-color: rgba(225, 29, 72, 0.15); border-color: rgba(244, 63, 94, 0.3); }
            50% { background-color: rgba(225, 29, 72, 0.45); border-color: #f43f5e; }
        }

        .critical-flash-warning { 
            animation: alertFlashRed 1.6s infinite ease-in-out; 
        }

        @keyframes textPulseRose {
            0%, 100% { color: #fecdd3; }
            50% { color: #f43f5e; font-weight: 900; }
        }

        .critical-text-pulse { 
            animation: textPulseRose 1.6s infinite ease-in-out; 
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased p-2 text-xs select-none h-screen flex flex-col overflow-hidden">

    <!-- CỔNG CHỜ NẠP KHUNG NHẬP BIẾN SỐ (HEADER) -->
    <div id="injection-header-container" class="shrink-0"></div>

    <!-- WORKSPACE CHÍNH TOÀN KHUNG -->
    <main class="flex-1 flex flex-col bg-gray-800 rounded-xl border border-gray-700 shadow-2xl min-h-0 overflow-hidden relative z-0">
        
        <!-- CỔNG CHỜ NẠP THANH ĐIỀU HƯỚNG TABS TỔNG -->
        <div id="injection-main-tabs-container" class="shrink-0"></div>

        <!-- PHÂN VÙNG HAI HÀNG TAB -->
        <div id="sub-navbar-container-zone" class="shrink-0 flex flex-col p-2 gap-2 bg-gray-800/90 z-10">
            
            <!-- HÀNG 1: QUẢN LÝ TEAM ACC GỐC -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-gray-700/70">
                <div class="flex-1 overflow-x-auto no-scrollbar">
                    <div class="flex items-center gap-1.5 min-w-max" id="sub-tabs-data-team-holder"></div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0 self-end sm:self-auto">
                    <button onclick="createNewTeamCorePipeline('data')" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded text-[11px] font-bold transition flex items-center gap-1 shadow cursor-pointer">
                        <i class="fa-solid fa-plus"></i> + Thêm Team
                    </button>
                    <button onclick="deleteTargetActiveTeamUnit('data')" class="bg-rose-900/80 hover:bg-rose-700 text-rose-200 p-1 px-2 rounded transition shadow cursor-pointer">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <!-- HÀNG 2: QUẢN LÝ ĐỘI HÌNH XẾP (LINEUP TEAMS) -->
            <div class="flex items-start justify-between gap-2 pt-0.5">
                <div class="flex-1 overflow-hidden">
                    <div class="flex items-center gap-1.5 w-full" id="sub-tabs-lineup-team-holder"></div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0 self-start">
                    <button onclick="createNewTeamCorePipeline('lineup')" class="bg-purple-600 hover:bg-purple-500 text-white p-1 px-2.5 rounded text-[11px] font-bold transition flex items-center justify-center gap-1 shadow cursor-pointer border border-purple-400/50" title="Thêm Đội Hình Xếp">
                        <i class="fa-solid fa-shuffle text-xs"></i> <span>+</span>
                    </button>
                    <button onclick="deleteTargetActiveTeamUnit('lineup')" class="bg-rose-800 hover:bg-rose-700 text-white p-1 px-2 rounded transition shadow cursor-pointer" title="Xóa Đội Hình này">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- VIEWPORT TRUNG TÂM HIỂN THỊ BẢNG TRỰC QUAN -->
        <div id="active-panel-view-viewport" class="flex-1 min-h-0 overflow-hidden p-2 bg-gray-850/40 rounded-b-xl flex flex-col"></div>
    </main>

    <!-- BONG BÓNG NHẬP ĐOÀI (GÓC DƯỚI TRÁI) -->
    <div id="floating-bubble-deo-container" class="fixed bottom-3 left-3 z-50 flex flex-col items-start gap-2 select-none">
        <div id="injection-deo-card-holder"></div>
        <button onclick="toggleFloatingDeoCard()" class="bg-gray-955 border border-purple-500 text-white font-black px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 hover:bg-gray-800 transition cursor-pointer select-none">
            <i class="fa-solid fa-gem text-purple-400"></i> Nhập Đoài
        </button>
    </div>

   <!-- CỤM 4 NÚT GOM CHUNG 1 HÀNG NGANG DUY NHẤT (GÓC DƯỚI PHẢI) -->
    <div id="floating-bubble-profit-container" class="fixed bottom-3 right-4 z-50 flex items-center gap-2 select-none">
        <button id="floating-bubble-changelog-button" onclick="toggleFloatingChangelogCard(event)" class="bg-gray-955 border border-cyan-500 text-cyan-400 font-black px-3.5 py-2.5 rounded-full shadow-2xl flex items-center gap-1.5 hover:bg-gray-800 transition cursor-pointer select-none text-xs">
            <i class="fa-solid fa-clock-rotate-left text-cyan-400"></i> Nhật Ký
        </button>

        <button id="floating-bubble-failed-button" onclick="toggleFloatingFailedCard(event)" class="bg-gray-955 border border-rose-500 text-white font-black px-3.5 py-2.5 rounded-full shadow-2xl flex items-center gap-1.5 hover:bg-gray-800 transition cursor-pointer select-none text-xs">
            <i class="fa-solid fa-triangle-exclamation text-rose-400"></i> Báo Thất Bại
        </button>
        
        <button id="floating-bubble-merchant-button" onclick="toggleFloatingMerchantCard(event)" class="bg-gray-955 border border-amber-500 text-amber-400 font-black px-3.5 py-2.5 rounded-full shadow-2xl flex items-center gap-1.5 hover:bg-gray-800 transition cursor-pointer select-none text-xs">
            <i class="fa-solid fa-gem text-amber-400"></i> Thương Nhân
        </button>
        
        <button id="floating-bubble-profit-button" onclick="toggleFloatingProfitCard(event)" class="bg-gray-955 border border-emerald-500 text-white font-black px-3.5 py-2.5 rounded-full shadow-2xl flex items-center gap-1.5 hover:bg-gray-800 transition cursor-pointer select-none text-xs">
            <i class="fa-solid fa-chart-pie text-emerald-400"></i> Lợi Nhuận
        </button>
    </div>

    <!-- KHUNG CHỨA POPUP NỔI ĐỘC LẬP (ĐẶT Ở ĐÁY NGOÀI NÚT BẤM) -->
    <div id="injection-profit-card-holder"></div>
    <div id="injection-merchant-card-holder" class="fixed bottom-16 right-[365px] z-50 select-none"></div>
    <div id="injection-failed-card-holder" class="fixed bottom-16 right-[715px] z-50 select-none"></div>
    <div id="injection-changelog-card-holder" class="fixed bottom-16 right-[1065px] z-50 select-none"></div>

    <div id="injection-settings-modal-container"></div>
<script src="tu-dong-luu-file.js"></script>
    <!-- 1. NẠP THÀNH PHẦN COMPONENT TĨNH -->
    <script src="khung-nhap-bien-so.js"></script>
    <script src="thanh-dieu-huong-tab.js"></script>
    <script src="hop-thoai-nhap-doai.js"></script>
    <script src="hop-thoai-loi-nhuan.js"></script>
    <script src="cua-so-cai-dat.js"></script>

    <!-- 2. HỆ THỐNG ENGINE ĐIỀU KHIỂN LOGIC & BỘ NHỚ LÕI -->
    <script src="du-lieu-goc.js"></script>
    <script src="kho-luu-tru.js"></script>
    <script src="tinh-toan-tai-chinh.js"></script>
    <script src="xu-ly-luot-bot.js"></script>
    <script src="bang-du-lieu-goc.js"></script>
    
    <!-- 3. QUẢN LÝ BẤM GIỜ, KỶ LỤC & LỜI LỖ ĐỘI HÌNH -->
    <script src="quan-ly-ngan-phieu.js"></script>
    <script src="dong-co-bam-gio-va-ky-luc.js"></script>
    <script src="bieu-do-duong-song-ky-luc.js"></script>
    <script src="tinh-toan-loi-lo-doi-hinh.js"></script>
    <script src="giao-dien-thanh-bam-gio-chan-bang.js"></script>
    <script src="giao-dien-dashboard-thong-ke.js"></script>
    <script src="bang-doi-hinh-xep.js"></script>

    <!-- 4. GIAO DIỆN CÀI ĐẶT & THÁI HƯ -->
    <script src="giao-dien-thai-hu.js"></script>
    <script src="giao-dien-cai-dat-mon-phai.js"></script>
    <script src="giao-dien-cai-dat.js"></script>
    <script src="quan-ly-nhat-ky-cap-nhat.js"></script>
    <script src="deo-dashboard.js"></script>
    <script src="giao-dien-doai.js"></script>
    <script src="script.js"></script>
    <script src="quan-ly-that-bai.js"></script>
    
    <!-- 5. NẠP FILE QUẢN LÝ THƯƠNG NHÂN & NHẬT KÝ -->
    <script src="dong-co-bam-gio-thuong-nhan.js"></script>
    <script src="quan-ly-thuong-nhan.js"></script>
    <script src="giao-dien-thuong-nhan.js"></script>
    <script src="quan-ly-nhat-ky-thong-bao.js"></script>

    <!-- 6. PHÂN HỆ SO SÁNH TỐI ƯU & LỜI LỖ HOẠT ĐỘNG -->
    <script src="kho_luu_tru_va_thoi_gian.js"></script>
    <script src="dong_co_tinh_toan_thai_hu.js"></script>
    <script src="dong_co_tinh_toan_thuong_nhan_va_tang_kiem.js"></script>
    <script src="thanh-cong-cu-so-sanh.js"></script>
    <script src="giao_dien_so_sanh_va_dieu_phoi.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof injectHeaderComponent === 'function') injectHeaderComponent();
            if (typeof injectMainTabsComponent === 'function') injectMainTabsComponent();
            if (typeof injectDeoCardComponent === 'function') injectDeoCardComponent();
            if (typeof injectProfitCardComponent === 'function') injectProfitCardComponent();
            if (typeof injectSettingsModalComponent === 'function') injectSettingsModalComponent();
        });
    </script>
</body>
</html>
