<body class="bg-gray-900 text-gray-100 font-sans antialiased p-2 text-xs select-none">

        let systemDatabase = { teams: [], members: {}, deoHistory: [], eventStartDate: "", eventEndDate: "" };
        let activeTeamId = "";
        let tokenCount = Date.now();
        let draggedRowIndex = null; // Biến tạm phục vụ Drag Drop kéo thả hàng

        function createUniqueId() { tokenCount++; return 'uid_' + tokenCount + '_' + Math.random().toString(36).substring(2, 6); }

        function initSystemEngine() {
            let savedData = localStorage.getItem('THAI_HU_UPGRADED_RUNTIME_DB') || localStorage.getItem('THAI_HU_PERSIST_DB');
            if (savedData) {
                try {
                    let runtimeCache = JSON.parse(savedData);
                    if (runtimeCache.teams && runtimeCache.members) {
                        systemDatabase = runtimeCache;
                        if (!systemDatabase.deoHistory) systemDatabase.deoHistory = [];
                        activeTeamId = systemDatabase.teams[0]?.id || "";
                        refreshUserInterfaceLayout(); return;
                    }
                } catch(e) { console.error(e); }
            }
            if (localStorage.getItem('THAI_HU_CUSTOM_DEFAULT_TEMPLATE')) {
                try {
                    systemDatabase = JSON.parse(localStorage.getItem('THAI_HU_CUSTOM_DEFAULT_TEMPLATE'));
                    if (!systemDatabase.deoHistory) systemDatabase.deoHistory = [];
                    Object.keys(systemDatabase.members).forEach(k => systemDatabase.members[k].currentRuns = 0);
                    activeTeamId = systemDatabase.teams[0]?.id || "";
                    refreshUserInterfaceLayout(); return;
                } catch(e) { console.error(e); }
            }
            parseAndLoadFromPayloadTemplate(HARDCODED_FACTORY_SEED);
        }

        function parseAndLoadFromPayloadTemplate(sourcePayload) {
            systemDatabase.teams = []; systemDatabase.members = {}; systemDatabase.deoHistory = [];
            sourcePayload.forEach(t => {
                let teamId = t.id || createUniqueId();
                let teamObj = { id: teamId, name: t.name, type: 'data', memberIds: [] };
                t.rows.forEach(r => {
                    let mId = createUniqueId();
                    systemDatabase.members[mId] = { id: mId, name: r.acc ? r.acc.trim() : "", maxRuns: 3, currentRuns: 0, originalTeamId: teamId, isEditing: false, freeRun2: false, freeRun3: false };
                    teamObj.memberIds.push(mId);
                });
                while(teamObj.memberIds.length < 8) {
                    let mId = createUniqueId();
                    systemDatabase.members[mId] = { id: mId, name: "", maxRuns: 3, currentRuns: 0, originalTeamId: teamId, isEditing: true, freeRun2: false, freeRun3: false };
                    teamObj.memberIds.push(mId);
                }
                systemDatabase.teams.push(teamObj);
            });
            activeTeamId = systemDatabase.teams[0]?.id || "";
            refreshUserInterfaceLayout(); saveStateToMemoryCache();

        function getParsedVNDValue(str) { return parseFloat((str||"").replace(/\./g, "")) * 1000 || 0; }

        // --- CẬP NHẬT LOGIC TÍNH TOÁN DỰA THEO TÍCH CHỌN LƯỢT FREE ---
        function calculateRealtimeProfits() {
            let materialPrice = parseFloat(document.getElementById('input-material-price').value) || 0;
            let goldRateVnd = getParsedVNDValue(document.getElementById('input-gold-rate').value);
            let ticketPrice = parseFloat(document.getElementById('input-ticket-price').value) || 0;
            let includeDeo = document.getElementById('checkbox-toggle-include-deo').checked;
            let totalRuns = 0, totalMaterials = 0, totalTicketCostGold = 0;

            Object.keys(systemDatabase.members).forEach(mId => {
                let m = systemDatabase.members[mId]; if (!m || !m.name) return;
                let runs = m.currentRuns, max = m.maxRuns; totalRuns += runs;
                if (runs >= 1) totalMaterials += 24; if (runs >= 2) totalMaterials += 48; if (runs >= 3) totalMaterials += 48;
                
                // Lượt 2: Tính toán dựa trên ô tích chọn Free của riêng acc này
                if (runs >= 2) {
                    if (m.freeRun2) {
                        totalTicketCostGold += 0; // Tích chọn Free thì không tốn vàng vé
                    } else {
                        totalTicketCostGold += (max === 2) ? Math.max(0, ticketPrice - 16) : ticketPrice;
                    }
                }
                
                // Lượt 3: Tính toán dựa trên ô tích chọn Free của riêng acc này
                if (runs >= 3) {
                    if (m.freeRun3) {
                        totalTicketCostGold += 0; // Tích chọn Free thì không tốn vàng vé
                    } else {
                        totalTicketCostGold += Math.max(0, ticketPrice - 16);
                    }
                }
            });

            let finalNetGoldValue = (totalMaterials * materialPrice) - totalTicketCostGold + (includeDeo ? getDeoValueInTimeframe('today') : 0);
            let finalNetVndValue = (finalNetGoldValue / 1000) * goldRateVnd;

            document.querySelectorAll('[id="runtime-total-runs"]').forEach(el => el.innerText = totalRuns);
            document.querySelectorAll('[id="runtime-total-materials"]').forEach(el => el.innerText = totalMaterials + " nl");
            document.querySelectorAll('[id="runtime-total-costs"]').forEach(el => el.innerText = totalTicketCostGold.toFixed(1) + "v");
            let profitLabel = document.getElementById('runtime-net-profit-gold');
            profitLabel.innerText = `${finalNetGoldValue >= 0 ? '+' : ''}${finalNetGoldValue.toFixed(2)} Vàng`;
            document.getElementById('runtime-net-profit-vnd').innerText = `~ ${Math.round(finalNetVndValue).toLocaleString('vi-VN')} VND`;
            profitLabel.className = finalNetGoldValue >= 0 ? "text-sm font-black text-emerald-400 block" : "text-sm font-black text-rose-400 block";
        }

        // --- HÀM TOGGLE ĐỔI TRẠNG THÁI LƯỢT ĐI FREE KHI CLICK Ô TÍCH ---
        function toggleFreeRunState(memberId, runNumber, isChecked) {
            let m = systemDatabase.members[memberId];
            if (m) {
                if (runNumber === 2) m.freeRun2 = isChecked;
                if (runNumber === 3) m.freeRun3 = isChecked;
                calculateRealtimeProfits();
                saveStateToMemoryCache();
            }
        }

        function commitQuayDoaiEntry() {
            let amountInput = document.getElementById('input-deo-amount-increment'), priceInput = document.getElementById('input-current-deo-price');
            let count = parseInt(amountInput.value) || 0, price = parseFloat(priceInput.value) || 0;
            if (count <= 0) return;
            systemDatabase.deoHistory.push({ date: new Date().toISOString().split('T')[0], count: count, price: price, goldValue: count * price });
            amountInput.value = 1; updateDeoStatisticsDisplays(); calculateRealtimeProfits(); saveStateToMemoryCache();
        }

        function getDeoValueInTimeframe(timeframe) {
            if(!systemDatabase.deoHistory) return 0;
            let todayStr = new Date().toISOString().split('T')[0], currentMonthStr = todayStr.substring(0, 7);
            let filterFunc = () => true;
            if (timeframe === 'today') filterFunc = (item) => item.date === todayStr;
            else if (timeframe === 'month') filterFunc = (item) => item.date.startsWith(currentMonthStr);
            else if (timeframe === 'event') {
                let start = systemDatabase.eventStartDate ? new Date(systemDatabase.eventStartDate) : null, end = systemDatabase.eventEndDate ? new Date(systemDatabase.eventEndDate) : null;
                filterFunc = (item) => { let d = new Date(item.date); return !(start && d < start) && !(end && d > end); };
            }
            let targetedHistory = systemDatabase.deoHistory.filter(filterFunc);
            
            if (timeframe === 'today') {
                let currentInputPrice = parseFloat(document.getElementById('input-current-deo-price').value) || 0;
                return targetedHistory.reduce((sum, item) => sum + (item.count * currentInputPrice), 0);
            }
            return targetedHistory.reduce((sum, item) => sum + item.goldValue, 0);
        }

        function updateDeoStatisticsDisplays() {
            if(!systemDatabase.deoHistory) systemDatabase.deoHistory = [];
            let todayStr = new Date().toISOString().split('T')[0], currentMonthStr = todayStr.substring(0, 7);
            let currentPrice = parseFloat(document.getElementById('input-current-deo-price').value) || 0;

            let todayRows = systemDatabase.deoHistory.filter(x => x.date === todayStr);
            let todayCount = todayRows.reduce((s, i) => s + i.count, 0);
            document.getElementById('display-deo-today').innerText = `${todayCount} Quẻ (${(todayCount * currentPrice).toFixed(1)}v)`;

            let monthRows = systemDatabase.deoHistory.filter(x => x.date.startsWith(currentMonthStr));
            document.getElementById('display-deo-month').innerText = `${monthRows.reduce((s, i) => s + i.count, 0)} Quẻ (${monthRows.reduce((s, i) => s + i.goldValue, 0).toFixed(1)}v)`;

            let start = systemDatabase.eventStartDate ? new Date(systemDatabase.eventStartDate) : null, end = systemDatabase.eventEndDate ? new Date(systemDatabase.eventEndDate) : null;
            let evRows = systemDatabase.deoHistory.filter(item => { let d = new Date(item.date); return !(start && d < start) && !(end && d > end); });
            document.getElementById('display-deo-event').innerText = `${evRows.reduce((s, i) => s + i.count, 0)} Quẻ (${evRows.reduce((s, i) => s + i.goldValue, 0).toFixed(1)}v)`;
        }

        function createNewTeamCorePipeline(type = 'data') {
            let labelChar = String.fromCharCode(65 + (systemDatabase.teams.filter(x => x.type === type).length % 26));
            let teamName = type === 'data' ? `Team ${labelChar.toLowerCase()}` : `Đội Hình Xếp ${labelChar}`;
            let teamId = 'team_' + Date.now(), teamObj = { id: teamId, name: teamName, type: type, memberIds: [] };
            for(let i=0; i<8; i++) {
                let mId = createUniqueId(); if(type === 'data') systemDatabase.members[mId] = { id: mId, name: "", maxRuns: 3, currentRuns: 0, originalTeamId: teamId, isEditing: true, freeRun2: false, freeRun3: false };
                teamObj.memberIds.push(mId);  
            }
            systemDatabase.teams.push(teamObj); activeTeamId = teamId; refreshUserInterfaceLayout(); saveStateToMemoryCache();
        }

            if(!activeTeamId || !confirm("Xác nhận xóa nhóm này?")) return;

        function enableMemberNameEditing(id) { if(systemDatabase.members[id]) { systemDatabase.members[id].isEditing = true; renderActiveWorkspacePanel(); } }
        function adjustRunsCounter(memberId, step) { let m = systemDatabase.members[memberId]; if(!m) return; let targetValue = m.currentRuns + step; if (targetValue < 0) return; if (targetValue > m.maxRuns && step > 0) { alert(`Đã chạm giới hạn ${m.maxRuns} lượt cấu hình ngày!`); return; } m.currentRuns = targetValue; renderActiveWorkspacePanel(); saveStateToMemoryCache(); }
        function bindSelectionToLineupIndexSlot(lineupTeamId, index, memberId) { let team = systemDatabase.teams.find(x => x.id === lineupTeamId); if(team) { team.memberIds[index] = memberId; renderActiveWorkspacePanel(); saveStateToMemoryCache(); } }
        
        function executeRecordTeamMigration(memberId, sourceTeamId) {
            let destTeamId = document.getElementById(`migration-target-box-${memberId}`).value; if(!destTeamId) return;
            let sTeam = systemDatabase.teams.find(x => x.id === sourceTeamId), dTeam = systemDatabase.teams.find(x => x.id === destTeamId), mObj = systemDatabase.members[memberId];
            if(!sTeam || !dTeam || !mObj) return;
            let emptyTargetIdx = dTeam.memberIds.findIndex(id => !systemDatabase.members[id] || systemDatabase.members[id].name.trim() === "");
            if(emptyTargetIdx !== -1) { delete systemDatabase.members[dTeam.memberIds[emptyTargetIdx]]; dTeam.memberIds[emptyTargetIdx] = memberId; } 
            else { if(dTeam.memberIds.length >= 8) { alert("Nhóm đích đã đầy đủ 8 vị trí!"); return; } dTeam.memberIds.push(memberId); }
            let sIdx = sTeam.memberIds.indexOf(memberId); if(sIdx !== -1) { let newBlankId = createUniqueId(); systemDatabase.members[newBlankId] = { id: newBlankId, name: "", maxRuns: 3, currentRuns: 0, originalTeamId: sourceTeamId, isEditing: true, freeRun2: false, freeRun3: false }; sTeam.memberIds[sIdx] = newBlankId; }
            mObj.originalTeamId = destTeamId; refreshUserInterfaceLayout(); saveStateToMemoryCache();
        }

        function copyToClipboardTextSystem(str) { if(!str) return; navigator.clipboard.writeText(str).then(() => { let toast = document.createElement('div'); toast.className = "fixed bottom-16 left-1/2 -translate-x-1/2 bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg text-[10px] z-50 shadow-2xl"; toast.innerText = `Đã Copy: ${str}`; document.body.appendChild(toast); setTimeout(() => toast.remove(), 1000); }); }

        function openSettingsModal() { document.getElementById('modal-team-filter-picker').innerHTML = systemDatabase.teams.filter(x => x.type === 'data').map(x => `<option value="${x.id}">${x.name.toUpperCase()}</option>`).join(''); document.getElementById('settings-modal').classList.remove('hidden'); renderModalMembersConfigRows(); }
        function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }
        function renderModalMembersConfigRows() {
            let teamId = document.getElementById('modal-team-filter-picker').value, targetWrapper = document.getElementById('modal-members-config-scroll-area'); targetWrapper.innerHTML = ""; let team = systemDatabase.teams.find(x => x.id === teamId); if(!team) return;
            team.memberIds.forEach(mId => { let m = systemDatabase.members[mId]; if(!m || !m.name) return; let block = document.createElement('div'); block.className = "flex items-center justify-between bg-gray-900 p-2 rounded-lg border border-gray-750 gap-2 text-xs"; block.innerHTML = `<div class="truncate font-bold text-gray-200">${m.name}</div><select data-target-mid="${m.id}" class="modal-inner-max-run-select bg-gray-800 border border-gray-600 rounded p-1 text-[11px] text-yellow-400 font-bold focus:outline-none"><option value="1" ${m.maxRuns === 1 ? 'selected' : ''}>Max 1 Lượt</option><option value="2" ${m.maxRuns === 2 ? 'selected' : ''}>Max 2 Lượt</option><option value="3" ${m.maxRuns === 3 ? 'selected' : ''}>Max 3 Lượt</option></select>`; targetWrapper.appendChild(block); });
        }
        function commitModalMaxRunBoundSettings() { document.querySelectorAll('.modal-inner-max-run-select').forEach(box => { let mId = box.getAttribute('data-target-mid'), maxVal = parseInt(box.value) || 3; if(systemDatabase.members[mId]) { systemDatabase.members[mId].maxRuns = maxVal; if(systemDatabase.members[mId].currentRuns > maxVal) systemDatabase.members[mId].currentRuns = maxVal; } }); closeSettingsModal(); refreshUserInterfaceLayout(); saveStateToMemoryCache(); }
        function exportFullConfigurationState() { let blob = new Blob([JSON.stringify(systemDatabase, null, 2)], { type: "application/json" }); let anchor = document.createElement('a'); anchor.href = URL.createObjectURL(blob); anchor.download = `Backup_Thai_Hu_Farm_${Date.now()}.json`; anchor.click(); }
        function importFullConfigurationState(event) { let file = event.target.files[0]; if(!file) return; let reader = new FileReader(); reader.onload = function(e) { try { let parsed = JSON.parse(e.target.result); if(parsed.teams && parsed.members) { systemDatabase = parsed; activeTeamId = systemDatabase.teams[0]?.id || ""; refreshUserInterfaceLayout(); saveStateToMemoryCache(); alert("Đã nạp khôi phục cấu hình thành công!"); } } catch(err) { alert("Lỗi tệp JSON."); } }; reader.readAsText(file); }

        window.onload = initSystemEngine;
    </script>
</body>
</html>
